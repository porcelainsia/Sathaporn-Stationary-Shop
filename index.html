<title>สหกรณ์โรงเรียนสถาพรศึกษา</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  // ---- Firebase setup: backs a window.storage shim with the same shape as ----
  // ---- Claude's artifact storage API, so the rest of the app is unchanged. ----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, increment,
    collection, getDocs
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsOmyOALjussJ81waMLjgJBQvVFnQ3xIc",
    authDomain: "sathaporn-school-shop.firebaseapp.com",
    projectId: "sathaporn-school-shop",
    storageBucket: "sathaporn-school-shop.firebasestorage.app",
    messagingSenderId: "868289495495",
    appId: "1:868289495495:web:589e4d5d919241976919e2"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  let ready = false;
  const readyPromise = signInAnonymously(auth)
    .then(()=>{ ready = true; })
    .catch((e)=>{ console.error('Firebase anonymous sign-in failed', e); throw e; });

  // "shared" data lives in top-level collections everyone can read/write.
  // "personal" data (currently just the seller name typed on this device)
  // has no real per-person login here, so it lives in this browser's own
  // localStorage instead of the cloud — same effect, simpler, and free.
  function metaDocRef(key){ return doc(db, 'meta', key); }
  function saleDocRef(id){ return doc(db, 'sales', id); }

  window.storage = {
    async get(key, shared){
      await readyPromise;
      if(!shared){
        const v = localStorage.getItem('local:'+key);
        return v === null ? null : { key, value: v, shared:false };
      }
      if(key.indexOf('sale:') === 0){
        const id = key.slice(5);
        const snap = await getDoc(saleDocRef(id));
        if(!snap.exists()) return null;
        return { key, value: JSON.stringify(snap.data()), shared:true };
      }
      const snap = await getDoc(metaDocRef(key));
      if(!snap.exists()) return null;
      return { key, value: snap.data().value, shared:true };
    },
    async set(key, value, shared){
      await readyPromise;
      if(!shared){
        localStorage.setItem('local:'+key, value);
        return { key, value, shared:false };
      }
      if(key.indexOf('sale:') === 0){
        const id = key.slice(5);
        await setDoc(saleDocRef(id), JSON.parse(value));
        return { key, value, shared:true };
      }
      await setDoc(metaDocRef(key), { value });
      return { key, value, shared:true };
    },
    async delete(key, shared){
      await readyPromise;
      if(!shared){
        localStorage.removeItem('local:'+key);
        return { key, deleted:true, shared:false };
      }
      if(key.indexOf('sale:') === 0){
        const id = key.slice(5);
        await deleteDoc(saleDocRef(id));
        return { key, deleted:true, shared:true };
      }
      await deleteDoc(metaDocRef(key));
      return { key, deleted:true, shared:true };
    },
    async list(prefix, shared){
      await readyPromise;
      if(prefix === 'sale:'){
        const snap = await getDocs(collection(db, 'sales'));
        const keys = [];
        snap.forEach(d=>keys.push('sale:'+d.id));
        return { keys, prefix, shared:true };
      }
      return { keys: [], prefix, shared };
    }
  };

  // ---- Per-document product records in `stationary_products`, mirroring ----
  // ---- the uniform shop's pattern (race-safe stock via Firestore increment). ----
  function productDocRef(id){ return doc(db, 'stationary_products', id); }

  window.stockApi = {
    async listProducts(){
      await readyPromise;
      const snap = await getDocs(collection(db, 'stationary_products'));
      const out = [];
      snap.forEach(d=>out.push(Object.assign({ id: d.id }, d.data())));
      return out;
    },
    async saveProduct(id, data){
      await readyPromise;
      await setDoc(productDocRef(id), data, { merge:true });
    },
    async deleteProduct(id){
      await readyPromise;
      await deleteDoc(productDocRef(id));
    },
    async setFields(id, fields){
      await readyPromise;
      await updateDoc(productDocRef(id), fields);
    },
    async adjustRemaining(id, delta){
      await readyPromise;
      if(!delta) return;
      await updateDoc(productDocRef(id), { remaining: increment(delta) });
    }
  };
</script>

  .sale-entry .se-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .sale-entry .se-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .sale-entry .se-total{font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:700; color:var(--stamp);}
  .sale-entry .se-items{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .sale-entry .se-del{
    background:none; border:1px solid var(--stamp); color:var(--stamp); border-radius:7px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .se-actions{display:flex; gap:8px; margin-top:6px;}
  .se-editbtn{
    background:none; border:1px solid var(--teal); color:var(--teal-dark); border-radius:7px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .sale-editor{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px 10px;
  }

  /* Report table */
  .report-table{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px;
  }
  .report-head{
    display:flex; gap:8px; padding-bottom:6px; margin-bottom:4px; border-bottom:1.5px solid var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); font-weight:600;
  }
  .report-cat{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--teal-dark); margin:10px 0 4px; font-weight:600;
  }
  .report-row{
    display:flex; gap:8px; padding:5px 0; border-bottom:1px dotted var(--line); font-size:12.5px;
  }
  .report-row.report-grand{
    border-bottom:none; border-top:1.5px dashed var(--ink); margin-top:6px; padding-top:8px; font-weight:700;
  }
  .report-row .rn, .report-head .rn{flex:1; min-width:0;}
  .report-row .rq, .report-head .rq{width:40px; text-align:right; font-family:'IBM Plex Mono',monospace;}
  .report-row .rv, .report-head .rv{width:64px; text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .report-row.report-grand .rv{color:var(--stamp);}

  /* Stock tab: editable quantities + drag-to-reorder */
  .stock-cat-group{margin-bottom:2px;}
  .stock-cat-items{display:flex; flex-direction:column;}
  .stock-cat-items > .stock-row{
    display:flex; align-items:stretch; gap:8px;
    background:none; border:none; padding:0; margin-bottom:8px;
  }
  .stock-row.dragging{opacity:.5;}
  .drag-handle{
    display:flex; align-items:center; justify-content:center; width:26px; flex-shrink:0;
    color:var(--ink-soft); font-size:16px; cursor:grab; touch-action:none; user-select:none;
    -webkit-user-select:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .stock-row-body{
    flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .stock-row-main{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .stock-row .fields{display:flex; align-items:flex-end; gap:10px; margin-top:8px;}
  .stock-row .fields .f{
    display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-soft);
  }
  .stock-row .fields input{
    width:64px; font-family:'IBM Plex Mono',monospace; font-size:13px; padding:6px 8px;
    border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink);
  }
  .stock-row .fields .sold{
    margin-left:auto; align-self:flex-end; font-size:11.5px; color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .stock-row.locked{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-bottom:8px;
    align-items:center; justify-content:space-between;
  }
  .stockline{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); flex-shrink:0;
  }
  .stockline.low{color:var(--stamp); font-weight:600;}
  .stockline.out{color:var(--stamp-dark); font-weight:700;}
</style>
</head>

  const extra = [...new Set(PRODUCTS.map(p=>p.cat))].filter(c=>!BASE_CATS.includes(c));
  return [...BASE_CATS, ...extra];
}

  const t = document.getElementById('toast');

}

// Loads products from the per-document `stationary_products` collection.
// On first run ever (collection empty), migrates from the old single-blob
// 'products' meta key (or the built-in defaults) so no data is lost, seeding
// received/remaining at 0 — the shop then does a first real stock count via
// the stock tab.
async function loadProducts(){
  try{
    let list = await window.stockApi.listProducts();
    if(!list || list.length === 0){
      let seed;
      try{
        const r = await window.storage.get('products', true);
        seed = r ? JSON.parse(r.value) : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
      }catch(e){ seed = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)); }
      const migrated = seed.map((p,idx)=>({
        id: p.id, name: p.name, price: p.price, cat: p.cat,
        received: 0, remaining: 0, order: idx
      }));
      for(const p of migrated){
        try{
          await window.stockApi.saveProduct(p.id, {
            name: p.name, price: p.price, cat: p.cat,
            received: p.received, remaining: p.remaining, order: p.order
          });
        }catch(e){ console.error('product migration failed for', p.id, e); }
      }
      list = migrated;
    }
    PRODUCTS = list.map(p=>({
      id: p.id, name: p.name, price: p.price, cat: p.cat,
      received: typeof p.received==='number' ? p.received : 0,
      remaining: typeof p.remaining==='number' ? p.remaining : 0,
      order: typeof p.order==='number' ? p.order : 0
    }));
  }catch(e){
    console.error('loadProducts failed', e);
    PRODUCTS = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)).map((p,idx)=>Object.assign(p, {received:0, remaining:0, order:idx}));
  }
  PRODUCTS.sort((a,b)=>(a.order||0)-(b.order||0));
  nextIdCounter = PRODUCTS.reduce((m,p)=>{
    const n = parseInt((p.id||'').replace('p',''),10);
    return isNaN(n) ? m : Math.max(m,n);
  }, 0) + 1;
}
async function loadState(){
  await loadProducts();
  try{
    const r = await window.storage.get('stock_status', true);
    stockStatus = r ? JSON.parse(r.value) : {};
  }catch(e){ stockStatus = {}; }
  try{
    const list = await window.storage.list('sale:', true);
    const keys = list ? list.keys : [];
    const results = await Promise.all(keys.map(k => window.storage.get(k, true).catch(()=>null)));
    transactions = results.filter(Boolean).map(r => JSON.parse(r.value));
  }catch(e){ transactions = []; }
  try{
    const r = await window.storage.get('my_name', false);
    myName = r ? r.value : '';
  }catch(e){ myName = ''; }
  try{
    const r = await window.storage.get('known_names', true);
    knownNames = r ? JSON.parse(r.value) : [];
  }catch(e){ knownNames = []; }
}
async function saveStock(){
  try{ await window.storage.set('stock_status', JSON.stringify(stockStatus), true); }
  catch(e){ showToast('บันทึกสต็อกไม่สำเร็จ'); }
}
async function saveMyName(name){
  myName = name;
  try{ await window.storage.set('my_name', name, false); }catch(e){}
  if(name && !knownNames.includes(name)){
    knownNames.push(name);
    try{ await window.storage.set('known_names', JSON.stringify(knownNames), true); }catch(e){}
  }
}
async function appendTransaction(sale){
  try{
    if(!window.storage) throw new Error('ไม่พบระบบจัดเก็บข้อมูล (window.storage undefined)');
    await window.storage.set('sale:' + sale.id, JSON.stringify(sale), true);
    return true;
  }catch(e){
    console.error('appendTransaction failed', e);
    showToast('บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ไม่ทราบสาเหตุ'), true);
    return false;
  }
}

function isOut(id){ return stockStatus[id] === false; }

// Reconciles stock ("คงเหลือ") for the difference between a sale's items
// before and after an operation — checkout is reconcileStockDeltas([], items),
// a full delete is reconcileStockDeltas(items, []), and an item-level edit is
// reconcileStockDeltas(originalItems, finalItems). Uses Firestore increment()
// so concurrent edits from other devices stay race-safe.
async function reconcileStockDeltas(beforeItems, afterItems){
  const before = {}; (beforeItems||[]).forEach(i=>{ before[i.id] = (before[i.id]||0) + i.qty; });
  const after = {}; (afterItems||[]).forEach(i=>{ after[i.id] = (after[i.id]||0) + i.qty; });
  const ids = new Set([...Object.keys(before), ...Object.keys(after)]);
  for(const id of ids){
    const delta = (before[id]||0) - (after[id]||0);
    if(!delta) continue;
    const p = PRODUCTS.find(x=>x.id===id);
    if(p) p.remaining = (typeof p.remaining==='number' ? p.remaining : 0) + delta;
    try{ await window.stockApi.adjustRemaining(id, delta); }
    catch(e){ console.error('stock reconcile failed for', id, e); }
  }
}

function renderSell(){
  const el = document.getElementById('tab-sell');
  let html = '';
  catOrder().forEach(cat=>{
    const items = PRODUCTS.filter(p=>p.cat===cat);
    if(!items.length) return;
    html += `<div class="cat-label">${cat}</div><div class="grid">`;
    items.forEach(p=>{
      const qty = cart[p.id] || 0;
      const out = isOut(p.id);
      const remaining = typeof p.remaining==='number' ? p.remaining : 0;
      const sCls = stockClass(remaining);
      html += `<div class="item-btn ${out?'out':''}" data-id="${p.id}">
        ${qty>0?`<div class="badge">${qty}</div>`:''}
        <div class="stockline ${sCls}">${sCls==='out'?'หมด':'เหลือ '+remaining}</div>
        <div class="name">${p.name}</div>
        <div class="price">฿${p.price}</div>
      </div>`;
    });
    html += `</div>`;
  });

  const cartIds = Object.keys(cart).filter(id=>cart[id]>0);
  const total = cartIds.reduce((s,id)=> s + cart[id]*PRODUCTS.find(p=>p.id===id).price, 0);

  html += `<div class="receipt">
    <div class="receipt-title"><span>รายการที่เลือก</span>${cartIds.length?'<button id="clearCart">ล้าง</button>':''}</div>
    ${cartIds.length===0 ? '<div class="cart-empty">แตะสินค้าด้านบนเพื่อเพิ่ม</div>' : cartIds.map(id=>{
      const p = PRODUCTS.find(x=>x.id===id);
      return `<div class="cart-row">
        <span class="cname">${p.name}</span>
        <span class="qty-ctrl">
          <button data-dec="${id}">−</button>
          <span>${cart[id]}</span>
          <button data-inc="${id}">+</button>
        </span>
        <span class="csub">฿${p.price*cart[id]}</span>
      </div>`;
    }).join('')}
    <div class="total-row"><span class="label">รวมทั้งสิ้น</span><span class="amount">฿${total}</span></div>
    <button class="save-btn" id="saveSale" ${cartIds.length===0?'disabled':''}>บันทึกการขาย</button>
  </div>`;

  el.innerHTML = html;

  el.querySelectorAll('.item-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      if(isOut(id)) return;
      cart[id] = (cart[id]||0) + 1;
      renderSell();
    });
    b.addEventListener('contextmenu', (e)=>{
      e.preventDefault();
      const id = b.dataset.id;
      if(isOut(id)) return;
      if(cart[id]){
        cart[id] -= 1;
        if(cart[id]<=0) delete cart[id];
        renderSell();
      }
    });
  });
  el.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation(); const id=b.dataset.inc; cart[id]=(cart[id]||0)+1; renderSell();
  }));
  el.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation(); const id=b.dataset.dec; cart[id]=Math.max(0,(cart[id]||0)-1); if(cart[id]===0) delete cart[id]; renderSell();
  }));
  const clearBtn = document.getElementById('clearCart');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ cart={}; renderSell(); });

  const saveBtn = document.getElementById('saveSale');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    const items = cartIds.map(id=>{
      const p = PRODUCTS.find(x=>x.id===id);
      return {id, name:p.name, price:p.price, qty:cart[id]};
    });
    const now = new Date();
    const sale = {
      id: now.getTime() + '-' + Math.random().toString(36).slice(2,7),
      dateKey: todayKey(),
      dateLabel: thaiDate(now),
      items, total, ts: now.toISOString(),
      seller: myName || ''
    };
    const ok = await appendTransaction(sale);
    if(ok){
      transactions.push(sale);
      cart = {};
      await reconcileStockDeltas([], items);
      showToast('บันทึกการขายแล้ว ✓');
    }
    renderSell();
  });
}

function getItemCategory(item){
  const p = PRODUCTS.find(x=>x.id===item.id);
  if(p) return p.cat;
  if(item.name && item.name.indexOf('สมุด') === 0) return 'สมุด';
  return 'อื่นๆ';
}

async function clearTransactionsByDate(dateKey){
  showToast('กำลังลบ...');
  const toDelete = dateKey ? transactions.filter(t=>t.dateKey===dateKey) : transactions;
  try{
    for(const t of toDelete){
      await window.storage.delete('sale:'+t.id, true).catch(()=>{});
    }
  }catch(e){}
  const deleteIds = new Set(toDelete.map(t=>t.id));
  transactions = transactions.filter(t=>!deleteIds.has(t.id));
  const allItems = toDelete.reduce((acc,t)=>acc.concat(t.items||[]), []);
  await reconcileStockDeltas(allItems, []);
  editDataMode = false;
  showToast('ลบข้อมูลแล้ว ✓');
  renderSummary();
}

function splitDayByCategory(dk){
  const dayTx = transactions.filter(t=>t.dateKey===dk);
  const books = {}, others = {};
  dayTx.forEach(t=>t.items.forEach(i=>{
    const bucket = getItemCategory(i) === 'สมุด' ? books : others;
    bucket[i.name] = bucket[i.name] || {price:i.price, qty:0, sub:0};
    bucket[i.name].qty += i.qty;
    bucket[i.name].sub += i.qty*i.price;
  }));
  return {books, others};
}
function sumQty(obj){ return Object.values(obj).reduce((s,o)=>s+o.qty,0); }
function sumSub(obj){ return Object.values(obj).reduce((s,o)=>s+o.sub,0); }

function downloadExcel(){
  try{
    const days = [...new Set(transactions.map(t=>t.dateKey))].sort();
    const rows = [["วันที่","รายการ","ราคา","จำนวน","รวม"]];
    const dateCellRefs = [];
    const currencyCellRefs = [];
    days.forEach(dk=>{
      const {books, others} = splitDayByCategory(dk);
      let dateUsed = false;
      const dateObj = new Date(dk+'T00:00:00');
      const pushRow = (name, price, qty, sub, isCurrency)=>{
        rows.push([ dateUsed ? '' : dateObj, name, price, qty, sub ]);
        const r = rows.length; // 1-indexed row number in sheet
        if(!dateUsed) dateCellRefs.push('A'+r);
        if(isCurrency){ currencyCellRefs.push('C'+r); currencyCellRefs.push('E'+r); }
        dateUsed = true;
      };
      Object.keys(books).forEach(n=>pushRow(n, books[n].price, books[n].qty, books[n].sub, true));
      if(Object.keys(books).length){
        pushRow('ยอดเงินรวม สมุด', '', sumQty(books), sumSub(books), false);
        currencyCellRefs.push('E'+rows.length);
      }
      Object.keys(others).forEach(n=>pushRow(n, others[n].price, others[n].qty, others[n].sub, true));
      if(Object.keys(others).length){
        pushRow('ยอดเงินรวม อุปกรณ์การศึกษา', '', sumQty(others), sumSub(others), false);
        currencyCellRefs.push('E'+rows.length);
      }
      rows.push(['','','','','']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:12},{wch:28},{wch:9},{wch:9},{wch:11}];
    dateCellRefs.forEach(ref=>{ if(ws[ref]) ws[ref].z = 'd mmm yy'; });
    currencyCellRefs.forEach(ref=>{ if(ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '"฿"#,##0'; });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
    XLSX.writeFile(wb, `sales_${todayKey()}.xlsx`);
    showToast('ดาวน์โหลดแล้ว ✓');
  }catch(e){
    showToast('ดาวน์โหลดไม่สำเร็จ ลองคัดลอกข้อความแทน');
  }
}

function buildExportText(dateKeyOrKeys){
  const dks = Array.isArray(dateKeyOrKeys) ? [...dateKeyOrKeys].sort()
             : dateKeyOrKeys ? [dateKeyOrKeys] : [todayKey()];
  const dayBlocks = dks.map(dk=>{
    const {books, others} = splitDayByCategory(dk);
    let lines = [];
    let first = true;
    const pushLine = (name, price, qty, sub)=>{
      lines.push(`${first?dk:''}\t${name}\t${price}\t${qty}\t${sub}`);
      first = false;
    };
    Object.keys(books).forEach(n=>pushLine(n, books[n].price, books[n].qty, books[n].sub));
    if(Object.keys(books).length) pushLine('ยอดเงินรวม สมุด', '', sumQty(books), sumSub(books));
    Object.keys(others).forEach(n=>pushLine(n, others[n].price, others[n].qty, others[n].sub));
    if(Object.keys(others).length) pushLine('ยอดเงินรวม อุปกรณ์การศึกษา', '', sumQty(others), sumSub(others));
    return lines.join('\n');
  });
  return dayBlocks.join('\n\t\t\t\t\n');
}

// Dependency-free, touch-and-mouse drag-to-reorder for the admin stock list.
// Scoped per category: a dragged row is only ever moved within its own
// `.stock-cat-items` container, so items can't be dragged into another
// category. On drop, persists the new `order` field for that category's
// items to Firestore.
function wireDragReorder(root){
  root.querySelectorAll('.stock-cat-items').forEach(list=>{
    list.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        const row = handle.closest('.stock-row');
        if(!row) return;
        e.preventDefault();
        row.classList.add('dragging');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}

        const onMove = (ev)=>{
          const y = ev.clientY;
          const rows = [...list.querySelectorAll('.stock-row')].filter(r=>r!==row);
          let target = null;
          for(const r of rows){
            const rect = r.getBoundingClientRect();
            if(y < rect.top + rect.height/2){ target = r; break; }
          }
          if(target){
            if(row.nextElementSibling !== target) list.insertBefore(row, target);
          } else if(list.lastElementChild !== row){
            list.appendChild(row);
          }
        };
        const onUp = async ()=>{
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          row.classList.remove('dragging');
          try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
          const ids = [...list.querySelectorAll('.stock-row')].map(r=>r.dataset.id);
          ids.forEach((id, idx)=>{
            const p = PRODUCTS.find(x=>x.id===id);
            if(p) p.order = idx;
          });
          PRODUCTS.sort((a,b)=>(a.order||0)-(b.order||0));
          try{
            await Promise.all(ids.map((id, idx)=> window.stockApi.setFields(id, {order: idx})));
          }catch(err){ console.error('reorder save failed', err); showToast('บันทึกลำดับไม่สำเร็จ'); }
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  });
}

function renderStock(){
  const el = document.getElementById('tab-stock');

  if(!adminUnlocked){
    let html = `<div class="lock-banner">
      <div class="li">🔒</div>
      <p>แก้ไข เพิ่ม หรือลบสินค้าได้เฉพาะผู้ดูแล<br>ใส่รหัสเพื่อปลดล็อก</p>
      <button id="unlockStock">ปลดล็อก</button>
    </div>`;
    catOrder().forEach(cat=>{
      const items = PRODUCTS.filter(p=>p.cat===cat);
      if(!items.length) return;
      html += `<div class="cat-label">${cat}</div>`;
      items.forEach(p=>{
        const out = isOut(p.id);
        const remaining = typeof p.remaining==='number' ? p.remaining : 0;
        html += `<div class="stock-row locked">
          <div class="info"><div class="n">${p.name}${out?' (หมด)':''}</div><div class="p">฿${p.price}</div></div>
          <div class="stockline ${out?'out':''}">${out?'หมด':'คงเหลือ '+remaining}</div>
        </div>`;
      });
    });
    el.innerHTML = html;
    document.getElementById('unlockStock').addEventListener('click', ()=>{
      openAdminGate('ใส่รหัสเพื่อปลดล็อก', 'ต้องใส่รหัสผู้ดูแลก่อนแก้ไขสินค้า', ()=>{
        adminUnlocked = true;
        renderStock();
      });
    });
    return;
  }

  let html = `<div class="relock-row"><button class="relock-btn" id="relockStock">🔒 ล็อกอีกครั้ง</button></div>`;
  html += `<button class="add-item-btn" id="toggleAdd">${showAddForm?'− ปิดฟอร์ม':'+ เพิ่มสินค้าใหม่'}</button>`;

  if(showAddForm){
    const catOptions = [...catOrder(), 'อื่นๆ'];
    html += `<div class="add-form">
      <div class="frow">
        <input type="text" id="newName" placeholder="ชื่อสินค้า">
        <input type="number" id="newPrice" placeholder="ราคา" min="0">
      </div>
      <div class="frow">
        <select id="newCat">${catOptions.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input type="text" id="newCatCustom" placeholder="ระบุหมวดหมู่" class="hidden">
      </div>
      <div class="actions">
        <button class="btn-cancel" id="cancelAdd">ยกเลิก</button>
        <button class="btn-save" id="confirmAdd">บันทึก</button>
      </div>
    </div>`;
  }

  catOrder().forEach(cat=>{
    const items = PRODUCTS.filter(p=>p.cat===cat);
    if(!items.length) return;
    html += `<div class="stock-cat-group"><div class="cat-label">${cat}</div><div class="stock-cat-items" data-cat="${cat}">`;
    items.forEach(p=>{
      if(editingId === p.id){
        html += `<div class="add-form">
          <div class="frow">
            <input type="text" id="editName" value="${p.name}">
            <input type="number" id="editPrice" value="${p.price}" min="0">
          </div>
          <div class="actions">
            <button class="btn-cancel" id="cancelEdit">ยกเลิก</button>
            <button class="btn-save" id="confirmEdit" data-id="${p.id}">บันทึก</button>
          </div>
        </div>`;
      } else {
        const on = !isOut(p.id);
        const received = typeof p.received==='number' ? p.received : 0;
        const remaining = typeof p.remaining==='number' ? p.remaining : 0;
        const sold = received - remaining;
        html += `<div class="stock-row" data-id="${p.id}">
          <div class="drag-handle" title="ลากเพื่อจัดเรียงลำดับ">⠿</div>
          <div class="stock-row-body">
            <div class="stock-row-main">
              <div class="info"><div class="n">${p.name}</div><div class="p">฿${p.price}</div></div>
              <div class="actions2">
                <div class="icon-btn edit" data-edit="${p.id}">✎</div>
                <div class="icon-btn del" data-del="${p.id}">🗑</div>
                <div class="switch ${on?'on':''}" data-id="${p.id}"><div class="knob"></div></div>
              </div>
            </div>
            <div class="fields">
              <label class="f"><span>รับเข้า</span><input type="number" min="0" data-field="received" data-id="${p.id}" value="${received}"></label>
              <label class="f"><span>คงเหลือ</span><input type="number" min="0" data-field="remaining" data-id="${p.id}" value="${remaining}"></label>
              <div class="sold">ขายแล้ว ${sold}</div>
            </div>
          </div>
        </div>`;
      }
    });
    html += `</div></div>`;
  });
  el.innerHTML = html;

  document.getElementById('relockStock').addEventListener('click', ()=>{
    adminUnlocked = false; renderStock();
  });

  document.getElementById('toggleAdd').addEventListener('click', ()=>{
    showAddForm = !showAddForm; editingId = null; renderStock();
  });

  el.querySelectorAll('.switch').forEach(s=>s.addEventListener('click', async ()=>{
    const id = s.dataset.id;
    stockStatus[id] = isOut(id) ? true : false;
    await saveStock();
    renderStock();
    renderSell();
  }));

  el.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const id = inp.dataset.id;
    const field = inp.dataset.field;
    const p = PRODUCTS.find(x=>x.id===id);
    if(!p) return;
    let val = parseInt(inp.value, 10);
    if(isNaN(val) || val < 0) val = 0;
    inp.value = val;
    try{
      if(field === 'received'){
        const delta = val - (p.received||0);
        p.received = val;
        p.remaining = Math.max(0, (p.remaining||0) + delta);
        await window.stockApi.setFields(id, {received: val});
        if(delta) await window.stockApi.adjustRemaining(id, delta);
      } else if(field === 'remaining'){
        p.remaining = val;
        await window.stockApi.setFields(id, {remaining: val});
      }
    }catch(e){
      console.error('stock field save failed', id, field, e);
      showToast('บันทึกสต็อกไม่สำเร็จ');
    }
    renderStock();
  }));

  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    editingId = b.dataset.edit; showAddForm = false; renderStock();
  }));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.del;
    const p = PRODUCTS.find(x=>x.id===id);
    openConfirm('ยืนยันการลบ', `ลบ "${p.name}" ออกจากรายการสินค้า?`, async ()=>{
      PRODUCTS = PRODUCTS.filter(x=>x.id!==id);
      delete cart[id];
      delete stockStatus[id];
      try{ await window.stockApi.deleteProduct(id); }catch(e){ console.error('delete product failed', id, e); }
      await saveStock();
      renderStock();
      renderSell();
    });
  }));

  const catSel = document.getElementById('newCat');
  if(catSel) catSel.addEventListener('change', ()=>{
    document.getElementById('newCatCustom').classList.toggle('hidden', catSel.value !== 'อื่นๆ');
  });
  const cancelAdd = document.getElementById('cancelAdd');
  if(cancelAdd) cancelAdd.addEventListener('click', ()=>{ showAddForm=false; renderStock(); });
  const confirmAdd = document.getElementById('confirmAdd');
  if(confirmAdd) confirmAdd.addEventListener('click', async ()=>{
    const name = document.getElementById('newName').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value);
    let cat = document.getElementById('newCat').value;
    if(cat === 'อื่นๆ'){
      cat = document.getElementById('newCatCustom').value.trim() || 'อื่นๆ';
    }
    if(!name || isNaN(price) || price < 0){
      showToast('กรอกชื่อและราคาให้ถูกต้อง'); return;
    }
    const id = 'p' + (nextIdCounter++);
    const maxOrder = PRODUCTS.reduce((m,p)=>Math.max(m, p.order||0), -1);
    const newProduct = {id, name, price, cat, received:0, remaining:0, order: maxOrder+1};
    PRODUCTS.push(newProduct);
    try{ await window.stockApi.saveProduct(id, {name, price, cat, received:0, remaining:0, order:newProduct.order}); }
    catch(e){ console.error('add product failed', id, e); showToast('เพิ่มสินค้าไม่สำเร็จ'); }
    showAddForm = false;
    showToast('เพิ่มสินค้าแล้ว ✓');
    renderStock();
    renderSell();
  });

  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.addEventListener('click', ()=>{ editingId=null; renderStock(); });
  const confirmEdit = document.getElementById('confirmEdit');
  if(confirmEdit) confirmEdit.addEventListener('click', async ()=>{
    const id = confirmEdit.dataset.id;
    const name = document.getElementById('editName').value.trim();
    const price = parseFloat(document.getElementById('editPrice').value);
    if(!name || isNaN(price) || price < 0){
      showToast('กรอกชื่อและราคาให้ถูกต้อง'); return;
    }
    const p = PRODUCTS.find(x=>x.id===id);
    p.name = name; p.price = price;
    try{ await window.stockApi.setFields(id, {name, price}); }
    catch(e){ console.error('edit product failed', id, e); showToast('บันทึกไม่สำเร็จ'); }
    editingId = null;
    showToast('บันทึกแล้ว ✓');
    renderStock();
    renderSell();
  });

  wireDragReorder(el);
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['sell','summary','stock'].forEach(name=>{
      document.getElementById('tab-'+name).classList.toggle('hidden', name!==t.dataset.tab);
    });
    if(t.dataset.tab==='summary') renderSummary();
    if(t.dataset.tab==='stock') renderStock();
  });
});

function populateNamesList(){
  const dl = document.getElementById('namesList');
  dl.innerHTML = knownNames.map(n=>`<option value="${n}"></option>`).join('');
}

(async function init(){
  document.getElementById('todayLabel').textContent = thaiDate(new Date());
  document.getElementById('sigilImg').src = SIGIL_B64;
  await loadState();
  document.getElementById('myNameInput').value = myName;
  populateNamesList();
  document.getElementById('saveNameBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('myNameInput').value.trim();
    if(!val){ showToast('พิมพ์ชื่อก่อนบันทึก'); return; }
    await saveMyName(val);
    populateNamesList();
    showToast('บันทึกชื่อแล้ว ✓');
  });
  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    showToast('กำลังอัปเดต...');
    await loadState();
    document.getElementById('myNameInput').value = myName;
    populateNamesList();
    const active = document.querySelector('.tab.active').dataset.tab;
    if(active==='sell') renderSell();
    if(active==='summary') renderSummary();
    if(active==='stock') renderStock();
    showToast('อัปเดตข้อมูลล่าสุดแล้ว ✓');
  });
  renderSell();
})();
</script>
</body>
</html>
